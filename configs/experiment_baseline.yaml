experiment_name: baseline_supervised
description: Supervised baseline without self-supervised pretraining

model:
  backbone: resnet50
  pretrained: imagenet
  num_classes: 10

training:
  batch_size: 32
  epochs: 100
  lr: 1e-4
  optimizer: adam
  scheduler: cosine

data:
  img_size: 224
  augmentation: standard

seed: 42
